<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#6d5ae8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <!-- Subtle inner highlight -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="white" opacity="0.06"/>
  <!-- Graduation cap -->
  <g filter="url(#softGlow)">
    <!-- Cap board (diamond) -->
    <path d="M256 118 L418 196 L256 274 L94 196 Z" fill="#ffffff"/>
    <!-- Cap body -->
    <path d="M170 232 v62 c0 30 38 54 86 54 s86 -24 86 -54 v-62 l-86 41 Z" fill="#ffffff" opacity="0.92"/>
    <!-- Tassel -->
    <line x1="418" y1="196" x2="418" y2="298" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="418" cy="312" r="18" fill="url(#goldGrad)"/>
  </g>
  <!-- Open book below -->
  <g>
    <path d="M150 372 c40 -18 74 -18 106 0 c32 -18 66 -18 106 0 v28 c-40 -18 -74 -18 -106 0 c-32 -18 -66 -18 -106 0 Z" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
